<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>IO Game Stats</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --cobbled-color: #ff6666;
            --cobbled-color-muted: #ff666699;
            --cobbled-bg: #331414;
            --cobbled-card: #4d1f1f;
            --cobbled-border: #803232;

            --flingy-color: #ff9966;
            --flingy-color-muted: #ff996699;
            --flingy-bg: #331f14;
            --flingy-card: #4d2e1e;
            --flingy-border: #804d32;

            --text-color: #ffffff;
            --text-muted: #ffffff99;
    
            --status-open: #87e65c;
            --status-open-bg: #87e65c33;
            --status-full: #ffc266;
            --status-full-bg: #ffc26633;
            --status-whitelisted: #ff6666;
            --status-whitelisted-bg: #ff666633;
            --status-busy: #ff9966;
            --status-busy-bg: #ff996633;
            --status-unknown: #bfbfbf;
            --status-unknown-bg: #bfbfbf33;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --cobbled-color: #bf4d4d;
                --cobbled-color-muted: #bf4d4d99;
                --cobbled-bg: #ffcccc;
                --cobbled-card: #ffb3b3;
                --cobbled-border: #ff9999;

                --flingy-color: #bf734d;
                --flingy-color-muted: #bf734d99;
                --flingy-bg: #ffdecc;
                --flingy-card: #ffccb3;
                --flingy-border: #ffac80;

                --text-color: #000000;
                --text-muted: #00000099;
    
                --status-open: #62a642;
                --status-open-bg: #62a64233;
                --status-full: #bf734d;
                --status-full-bg: #bf734d33;
                --status-whitelisted: #bf4d4d;
                --status-whitelisted-bg: #bf4d4d33;
                --status-busy: #bf734d;
                --status-busy-bg: #bf734d33;
                --status-unknown: #999999;
                --status-unknown-bg: #99999933;
            }
        }
        body {
            display: flex;
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #cobbled {
            flex: 1;
            background: var(--cobbled-bg);
            display: flex;
            align-items: flex-start;
            padding: 20px;
            justify-content: flex-start;
            flex-direction: column;
            .title {
                border-bottom-color: var(--cobbled-border);
            }
            .name {
                color: var(--cobbled-color);
            }
            .stat-card {
                background: var(--cobbled-card);
                border: 1px solid var(--cobbled-border);
            }
            .stat-value {
                color: var(--cobbled-color);
            }
            .server-card {
                background: var(--cobbled-card);
                border: 1px solid var(--cobbled-border);
            }
            .stat-label {
                color: var(--cobbled-color-muted);
            }
            .server-name {
                color: var(--cobbled-color);
            }
            .server-playerCount {
                color: var(--cobbled-color-muted);
            }
            .server-list-msg {
                color: var(--cobbled-color-muted);
            }
        }
        #flingy {
            flex: 1;
            background: var(--flingy-bg);
            display: flex;
            align-items: flex-start;
            padding: 20px;
            justify-content: flex-start;
            flex-direction: column;
            .title {
                border-bottom-color: var(--flingy-border);
            }
            .name {
                color: var(--flingy-color);
            }
            .stat-card {
                background: var(--flingy-card);
                border: 1px solid var(--flingy-border);
            }
            .stat-value {
                color: var(--flingy-color);
            }
            .server-card {
                background: var(--flingy-card);
                border: 1px solid var(--flingy-border);
            }
            .stat-label {
                color: var(--flingy-color-muted);
            }
            .server-name {
                color: var(--flingy-color);
            }
            .server-playerCount {
                color: var(--flingy-color-muted);
            }
            .server-list-msg {
                color: var(--flingy-color-muted);
            }
        }
        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid;
            padding-bottom: 20px;
            width: 100%;
        }
        .name {
            margin: 0;
        }
        .logo {
            width: 48px;
            height: 48px;
        }
        .stats {
            display: flex;
            width: 100%;
            margin-top: 20px;
            gap: 20px;
            .stat-card {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                text-align: center;
            }
            .stat-value {
                font-size: 28px;
                font-weight: bold;
            }
            .stat-label {
                font-size: 11px;
                margin-top: 2px;
            }
        }
        .server-list {
            margin-top: 20px;
            width: 100%;
            .server-card {
                padding: 10px;
                border-radius: 8px;
                .server-name {
                    font-size: 16px;
                    font-weight: bold;
                }
                .server-playerCount {
                    font-size: 12px;
                }
                .server-status {
                    border-radius: 4px;
                    font-size: 12px;
                    font-weight: bold;
                    padding: 4px;
                    color: var(--status-unknown);
                    background-color: var(--status-unknown-bg);
                }
                .server-status[data-status="open"] {
                    color: var(--status-open);
                    background-color: var(--status-open-bg);
                }
                .server-status[data-status="full"] {
                    color: var(--status-full);
                    background-color: var(--status-full-bg);
                }
                .server-status[data-status="whitelisted"] {
                    color: var(--status-whitelisted);
                    background-color: var(--status-whitelisted-bg);
                }
                .server-status[data-status="busy"] {
                    color: var(--status-busy);
                    background-color: var(--status-busy-bg);
                }
            }
            .server-list-msg {
                text-align: center;
                font-size: 12px;
            }
        }
    </style>
</head>

    <script>

        // init firebase

        const app = firebase.initializeApp({
            apiKey: "AIzaSyA1nix9aa5qnzVxkUMneFeoVusElS1rjSc",
            authDomain: "spinbase4096.firebaseapp.com",
            databaseURL: "https://spinbase4096-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "spinbase4096",
            storageBucket: "spinbase4096.firebasestorage.app",
            messagingSenderId: "785225414290",
            appId: "1:785225414290:web:597272c3d7cce0d2a984b"
        })
        const database = firebase.database()

        firebaseEmail = localStorage.getItem('FLINGY_FIREBASE_EMAIL')
        firebasePassword = localStorage.getItem('FLINGY_FIREBASE_PASSWORD')

        async function reauthFirebase() {
            if (!firebaseEmail || !firebasePassword) {
                console.warn('No Firebase credentials in localStorage!!!')
                return
            }
            try {
                await firebase.auth().signInWithEmailAndPassword(firebaseEmail, firebasePassword)
                console.log('Firebase authed')
            } catch (err) {
                console.warn('Firebase auth failed:', err.message)
            }
        }

        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                console.warn('Firebase auth lost, re-authing...')
                reauthFirebase()
            }
        })

        reauthFirebase()
        setInterval(() => reauthFirebase(), 30*60*1000)

        // Specific Functions
        
        async function setKey(key, value, path = 'flingy/servers', retry = true) {
            try {
                await database.ref(`${path}/${key}`).set(value)
            } catch (err) {
                let msg = (err.message || '').toLowerCase()
                let code = (err.code || '').toLowerCase()
                if (retry && (msg.includes('permission_denied') || code.includes('permission_denied'))) {
                    console.warn('Firebase permission denied, re-authing and retrying...')
                    await reauthFirebase()
                    setKey(key, value, path, false)
                } else {
                    console.warn('Firebase set failed:', err.message || err.code)
                }
            }
        }

        async function getKey(key, path = 'flingy/servers') {
            const snapshot = await database.ref(`${path}/${key}`).once('value')
            return snapshot.val()
        }

        // Render

        function renderServerList(game) {
            switch (game) {
                case 'cobbled.io': {
                    let servers = document.getElementById('cobbled-list')
                    servers.innerHTML = ''

                    if (gameData.cobbled.serverList.length == 0) {
                        servers.innerHTML = '<div class="server-list-msg">No servers online</div>'
                        return
                    }

                    for (let id of gameData.cobbled.serverList) {
                        let server = gameData.cobbled.servers[id]
                        if (!server || !server.config) continue

                        let card = document.createElement('div')
                        card.className = 'server-card'
                        card.dataset.id = id
                        card.style.display = 'flex'
                        card.style.alignItems = 'center' 

                        let left = document.createElement('div')
                        left.style.display = 'flex'
                        left.style.flexDirection = 'column'

                        let serverName = document.createElement('div')
                        serverName.className = 'server-name'
                        serverName.textContent = `${server.config.serverName} [${server.config.serverID.replace(`cobbled_`, ``)}]`
                        let playerCount = document.createElement('div')
                        playerCount.className = 'server-playerCount'
                        playerCount.textContent = `${server.playerCount}/${server.config.playerLimit} players`

                        let status = document.createElement('div')
                        status.className = 'server-status'
                        if (server.config.whitelist.length == 0 && server.playerCount < server.config.playerLimit) {
                            status.textContent = `Open`
                            status.dataset.status = 'open'
                        } else if (server.config.whitelist.length == 0) {
                            status.textContent = `Full`
                            status.dataset.status = 'full'
                        } else {
                            status.textContent = `Whitelisted`
                            status.dataset.status = 'whitelisted'
                        }
                        status.style.marginLeft = 'auto'
                        
                        left.appendChild(serverName)
                        left.appendChild(playerCount)
                        card.appendChild(left)
                        card.appendChild(status)
                        servers.appendChild(card)
                    }
                    break
                }
                case 'flingy.io': {
                    let servers = document.getElementById('flingy-list')
                    servers.innerHTML = ''

                    if (gameData.flingy.serverList.length == 0) {
                        servers.innerHTML = '<div class="server-list-msg">No servers online</div>'
                        return
                    }

                    for (let id of gameData.flingy.serverList) {
                        let server = gameData.flingy.servers[id]
                        if (!server || !server.config) continue

                        let card = document.createElement('div')
                        card.className = 'server-card'
                        card.dataset.id = id
                        card.style.display = 'flex'
                        card.style.alignItems = 'center' 

                        let left = document.createElement('div')
                        left.style.display = 'flex'
                        left.style.flexDirection = 'column'

                        let serverName = document.createElement('div')
                        serverName.className = 'server-name'
                        serverName.textContent = `${server.config.serverName} [${server.config.serverID.replace(`flingy_`, ``)}]`
                        let playerCount = document.createElement('div')
                        playerCount.className = 'server-playerCount'
                        playerCount.textContent = `${server.playerCount}/${server.config.playerLimit} players`
                        
                        let status = document.createElement('div')
                        status.className = 'server-status'
                        if (server.status == "0" && server.playerCount < server.config.playerLimit) {
                            status.textContent = `Open`
                            status.dataset.status = 'open'
                        } else if (server.status == "0") {
                            status.textContent = `Full`
                            status.dataset.status = 'full'
                        } else {
                            status.textContent = `Busy`
                            status.dataset.status = 'busy'
                        }
                        status.style.marginLeft = 'auto'
                        
                        left.appendChild(serverName)
                        left.appendChild(playerCount)
                        card.appendChild(left)
                        card.appendChild(status)
                        servers.appendChild(card)
                    }
                    break
                }
            }
        }

        function renderServerConfig(server) {
            // will render the popup or something idk
        }

        // Setup
        gameData = {
            cobbled: {
                serverList: [],
                servers: {},
            },
            flingy: {
                serverList: [],
                servers: {},
            },
        }
        document.getElementById('cobbled-servers').textContent = `?`
        document.getElementById('flingy-servers').textContent = `?`
        document.getElementById('cobbled-players').textContent = `?/?`
        document.getElementById('flingy-players').textContent = `?/?`

        // Listeners

        listenedServers = {
            cobbled: [],
            flingy: [],
        }

        database.ref('cobbled/servers/serverList').on('value', snap => {
            gameData.cobbled.serverList = snap.val() || []
            document.getElementById('cobbled-servers').textContent = gameData.cobbled.serverList.length
            if (gameData.cobbled.serverList.length == 0) document.getElementById('cobbled-players').textContent = `0/0`
            for (let id of gameData.cobbled.serverList) {
                if (listenedServers.cobbled.includes(id)) {continue} else {
                    database.ref(`cobbled/servers/${id}/ULID`).on('value', snap => {
                        gameData.cobbled.servers[id] = gameData.cobbled.servers[id] || {}
                        gameData.cobbled.servers[id].ULID = snap.val()
                        renderServerList('cobbled.io')
                    })
                    database.ref(`cobbled/servers/${id}/config`).on('value', snap => {
                        gameData.cobbled.servers[id] = gameData.cobbled.servers[id] || {}
